<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#e4c8b9"><title>玉环-解缘</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="v6.css"></head><body><main id="app">
  <section id="homeScreen" class="screen home-screen active"><div class="brand">玉<br>环<small>JIĚ YUÁN</small></div><div class="home-title"><small>东方美学 · 电子鲁班锁</small><h1>玉环-解缘</h1><p>一环一玉，一结一境</p></div><div class="hero-jewel"><i></i><i></i><i></i></div><nav class="home-menu"><button id="continueBtn"><b>继续上次游戏</b><small id="lastLabel">第一境 · 和田玉</small></button><button id="treasuryBtn"><b>进入藏宝阁</b><small>三十珍环 · 三十重天机</small></button><button id="settingsBtn"><b>设置</b><small>清音与操作</small></button></nav><footer>解一环，结一缘</footer></section>
  <section id="treasuryScreen" class="screen treasury-screen"><button class="back" id="treasuryBack">‹</button><header><small>THE JADE TREASURY</small><h1>藏宝阁</h1><p>三十珍环，各藏一重天机</p><span>已解 <b id="totalDone">0</b> / 30</span></header><div id="jewelGrid" class="jewel-grid"></div></section>
  <section id="gameScreen" class="screen game-screen"><header><div class="game-brand">玉环<br>解缘<i></i></div><div class="game-title"><span id="levelNo">第一境</span><h1 id="jewelName">和田玉</h1></div><div class="timer">◷ <b id="time">00:00</b></div><button id="gameExit" class="game-exit">×</button></header><div class="challenge-banner"><h2 id="blessingText">玉润心和，万事顺遂</h2><p id="wisdomText">谦谦君子，温润如玉</p></div><div class="oracle" id="oracle"><small>卦签</small><b id="oracleName">乾 · 阳</b><span id="oracleHint">生门西北 · 顺势而行</span></div><section class="board"><canvas id="board" width="720" height="1040"></canvas><div class="guide" id="guide"><i>↻</i><span>转动发光珠宝环<br>寻找金扣生门</span></div><div id="toast" class="toast"></div></section><aside class="steps"><span>步数</span><b id="moves">0</b><small id="moveGoal">/ 12</small></aside><nav class="game-tools"><button id="hint"><i>?</i><span>提示</span><em id="hints">3</em></button><button id="reset"><i>↻</i><span>重置</span></button><button id="sound"><i>♪</i><span>清音</span></button></nav><footer><i></i><span id="ruleText">依卦签辨旋向，让缺口通过发光金扣</span></footer></section>
  <div id="settingsModal" class="modal"><section><button class="modal-x" id="settingsClose">×</button><small>SETTINGS</small><h2>设置</h2><label><span><b>清音</b><small>背景音乐与玉石音效</small></span><input id="musicToggle" type="checkbox" checked></label><label><span><b>轻松模式</b><small>扩大金扣自动吸附范围</small></span><input id="easyToggle" type="checkbox" checked></label><button class="primary" id="settingsDone">完成</button></section></div>
  <div id="completeModal" class="modal"><section class="complete-card"><div class="complete-gem">✦</div><small>天机已解</small><h2 id="completeTitle">和田玉 · 收入藏宝阁</h2><p id="completeText">顺势而解，心境自明。</p><div><span><b id="finalMoves">0</b>步</span><span><b id="finalTime">00:00</b>流光</span></div><button class="primary" id="nextLevel">下一境</button></section></div>
  <audio id="bgm" src="assets/bgm.mp3" loop></audio><audio id="touch" src="assets/jade-touch.wav"></audio><audio id="release" src="assets/jade-release.wav"></audio><audio id="done" src="assets/jade-complete.wav"></audio>
</main><script src="game.js"></script></body></html>
